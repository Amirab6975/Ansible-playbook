---

docker_user: "{{ ansible_user  }}"

dnf_plugins:
  - dnf-plugins-core

remove_pkg:
  - docker
  - docker-client 
  - docker-client-latest 
  - docker-common 
  - docker-latest 
  - docker-latest-logrotate 
  - docker-logrotate 
  - docker-engine


docker_pkg:
  - docker-ce 
  - docker-ce-cli 
  - containerd.io 
  - docker-buildx-plugin 
  - docker-compose-plugin


docker_service_enabled: yes
