---
users:
  - ali
  - hossein
  - amir
  - hamid

group_list:
  - dev
  - prod


users_dict:
  developer:
    name: hamid
    group:  dev
  devops:
    name: ali
    group:  prod


packages:
  - httpd
  - nginx



services:
  webservers:
    - name: httpd
      state:  stopped
      enabled: no

    - name: nginx
      state:  restarted
      enabled:  yes

url:  "http://localhost:80"
file_dest:  "/root/index.html"
