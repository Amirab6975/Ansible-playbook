---
- name: Intro Of Sync & Copy Modules
  hosts:  all
  vars:
    home_dir: "{{playbook_dir}}"
    target_dir: "/tmp/"
  tasks:
    - name: Show Playbook Dir
      debug:
        msg:  "PlayBook Dir => {{ home_dir }}"
    - name: Copy Dir To Target
      copy:
        src:  "{{ home_dir  }}"
        dest: "{{ target_dir }}"
        owner:  root
        group:  root
        mode: "0644"
