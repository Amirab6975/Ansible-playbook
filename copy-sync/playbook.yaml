---
- name: Intro Of Sync & Copy Modules
  hosts:  all
  vars:
    home_dir: "{{playbook_dir}}"
    target_dir: "/tmp/"
  tasks:
    - name: Show Playbook Dir
      debug:
        msg:  "PlayBook Dir => {{ home_dir }}"
    - name: Copy Dir To Target
      copy:
        src:  "{{ home_dir  }}"
        dest: "{{ target_dir }}"
        owner:  root
        group:  root
        mode: "0644"

    - name: Remove test.txt
      file:
        path: "{{ target_dir }}/copy-sync/test.txt"
        state:  absent

    - name: Copy This Dir Exclud test.txt
      ansible.posix.synchronize:
        src:  "{{ home_dir  }}"
        dest: "{{ target_dir }}"
        rsync_opts:
          - "--exclude=test.txt"

